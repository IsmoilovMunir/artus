databaseChangeLog:
  - changeSet:
      id: 004-admin-user-table
      author: aston
      changes:
        - createTable:
            tableName: admin_user
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: email, type: varchar(255), constraints: { nullable: false, unique: true } }
              - column: { name: role, type: varchar(30), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: last_login, type: timestamp }
