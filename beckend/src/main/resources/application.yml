server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aston_admin}
    username: ${DB_USER:aston}
    password: ${DB_PASSWORD:aston}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Browser-facing URL for uploaded photos — MINIO_ENDPOINT is the internal
    # Docker hostname the backend uses to talk to MinIO, which isn't reachable
    # from a client's browser. Defaults to MINIO_ENDPOINT for convenience but
    # should be set to a publicly reachable host in every real deployment.
    public-url: ${MINIO_PUBLIC_URL:${app.minio.endpoint}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:aston-media}
  moysklad:
    base-url: ${MOYSKLAD_BASE_URL:https://api.moysklad.ru/api/remap/1.2}
    api-token: ${MOYSKLAD_API_TOKEN:}
